<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Barbershop — Agendamento Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#101c3a;
  --navy-2:#16224a;
  --blue:#2445a8;
  --red:#d62828;
  --red-2:#b81f1f;
  --white:#ffffff;
  --ink:#0b0c10;
  --paper:#f4f5f9;
  --muted:#6b7280;
  --line:#e4e6ee;
  --ok:#1e8e5a;
  --radius:14px;
  --shadow: 0 10px 30px rgba(16,28,58,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
  margin:0;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---- stripe divider (signature element) ---- */
.stripes{
  height:10px;
  background: repeating-linear-gradient(
    -45deg,
    var(--blue) 0px, var(--blue) 16px,
    var(--white) 16px, var(--white) 22px,
    var(--red) 22px, var(--red) 38px,
    var(--white) 38px, var(--white) 44px
  );
}
.stripes.thin{height:6px;}

/* ---- header ---- */
header.site{
  background:var(--navy);
  color:var(--white);
  position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow);
}
.header-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-name{font-size:20px;font-weight:700;line-height:1;}
.brand-sub{font-size:10px;letter-spacing:.25em;color:#9fb0e0;margin-top:2px;}
nav.top{display:flex;align-items:center;gap:6px;}
.nav-btn{
  color:#dbe2f5;background:transparent;padding:9px 14px;border-radius:8px;
  font-size:14px;font-weight:600;
}
.nav-btn:hover{background:rgba(255,255,255,.08);}
.nav-btn.cta{
  background:var(--red);color:var(--white);
}
.nav-btn.cta:hover{background:var(--red-2);}
.hamb{display:none;}

/* ---- logo mark svg wrapper ---- */
.logo-mark{width:40px;height:40px;flex-shrink:0;}

/* ---- layout ---- */
main{flex:1;width:100%;}
.container{max-width:1100px;margin:0 auto;padding:0 20px;}
.narrow{max-width:640px;}

/* ---- hero ---- */
.hero{
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
  color:var(--white);
  padding:64px 20px 56px;
  position:relative;
  overflow:hidden;
}
.hero-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--red);font-weight:700;letter-spacing:.18em;font-size:12px;
  margin-bottom:14px;
}
.hero h1{font-size:44px;line-height:1.05;color:var(--white);}
.hero h1 span{color:var(--red);}
.hero p.lead{color:#c7d0ea;font-size:17px;margin-top:16px;max-width:480px;line-height:1.5;}
.hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
.btn{
  padding:14px 24px;border-radius:9px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, background .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--red);color:var(--white);}
.btn-primary:hover{background:var(--red-2);}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.25);}
.btn-ghost:hover{background:rgba(255,255,255,.16);}
.btn-dark{background:var(--navy);color:var(--white);}
.btn-dark:hover{background:var(--navy-2);}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:var(--white);}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:7px;}

.hero-card{
  background:var(--white);color:var(--ink);border-radius:var(--radius);
  padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.hero-card h3{font-size:14px;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.hstep{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;font-weight:600;color:var(--navy);}
.hstep .n{width:24px;height:24px;border-radius:50%;background:var(--paper);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'Oswald';border:1.5px solid var(--line);}
.hstep-arrow{color:var(--line);padding-left:12px;font-size:12px;}

/* ---- sections ---- */
section{padding:56px 0;}
.section-head{margin-bottom:28px;}
.section-head .eyebrow{color:var(--red);}
.section-head h2{font-size:30px;color:var(--navy);}
.section-head p{color:var(--muted);margin-top:8px;font-size:15px;}

.grid{display:grid;gap:18px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}

.card{
  background:var(--white);border-radius:var(--radius);padding:20px;
  border:1px solid var(--line);box-shadow:0 2px 10px rgba(16,28,58,.04);
}
.service-card{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;position:relative;}
.service-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--blue);}
.service-card.selected{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,40,40,.15);}
.service-card.disabled{opacity:.45;cursor:not-allowed;}
.service-card.disabled:hover{transform:none;box-shadow:none;border-color:var(--line);}
.service-top{display:flex;justify-content:space-between;align-items:flex-start;}
.service-name{font-family:'Oswald';font-size:18px;color:var(--navy);text-transform:uppercase;}
.service-price{font-family:'Oswald';font-size:20px;color:var(--red);}
.service-desc{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.5;}
.service-meta{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:10px;}
.badge{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;
  background:var(--paper);color:var(--navy);letter-spacing:.03em;
}
.badge.red{background:#fdecec;color:var(--red-2);}
.badge.ok{background:#e7f6ee;color:var(--ok);}

.hours-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.hours-row:last-child{border-bottom:none;}

/* how it works */
.steps-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.step-item{text-align:center;}
.step-item .num{
  font-family:'Oswald';font-size:26px;color:var(--red);
}
.step-item .lbl{font-size:12.5px;color:var(--navy);font-weight:600;margin-top:4px;}

footer{background:var(--navy);color:#aab4d6;padding:28px 0;margin-top:auto;}
.footer-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;}

/* ---- auth ---- */
.auth-wrap{padding:64px 0;}
.auth-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;border:1px solid var(--line);}
.auth-card h2{font-size:24px;color:var(--navy);margin-bottom:6px;}
.auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:.02em;}
.field input, .field select, .field textarea{
  width:100%;padding:12px 13px;border-radius:8px;border:1.5px solid var(--line);
  font-size:14.5px;font-family:inherit;background:var(--paper);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue);background:var(--white);}
.error-box{background:#fdecec;color:var(--red-2);padding:10px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px;font-weight:600;}
.ok-box{background:#e7f6ee;color:var(--ok);padding:10px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px;font-weight:600;}
.switch-line{text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px;}
.switch-line b{color:var(--red);cursor:pointer;}

/* ---- booking flow ---- */
.progress{display:flex;align-items:center;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
.progress .pnode{
  display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);
  padding:6px 10px;border-radius:20px;background:var(--white);border:1.5px solid var(--line);
}
.progress .pnode.active{color:var(--white);background:var(--navy);border-color:var(--navy);}
.progress .pnode.done{color:var(--ok);border-color:var(--ok);}
.progress .sep{width:16px;height:1.5px;background:var(--line);}

.date-scroller{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;}
.date-pill{
  min-width:74px;text-align:center;padding:12px 8px;border-radius:10px;background:var(--white);
  border:1.5px solid var(--line);cursor:pointer;flex-shrink:0;
}
.date-pill .dow{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.date-pill .dnum{font-family:'Oswald';font-size:22px;color:var(--navy);margin:2px 0;}
.date-pill .mon{font-size:10.5px;color:var(--muted);}
.date-pill.selected{background:var(--navy);border-color:var(--navy);}
.date-pill.selected .dow,.date-pill.selected .dnum,.date-pill.selected .mon{color:var(--white);}
.date-pill.disabled{opacity:.35;cursor:not-allowed;}

.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.time-slot{
  padding:12px 6px;text-align:center;border-radius:9px;background:var(--white);
  border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--navy);cursor:pointer;
}
.time-slot:hover{border-color:var(--blue);}
.time-slot.selected{background:var(--red);border-color:var(--red);color:var(--white);}
.time-slot.taken{background:var(--paper);color:#c3c8d6;border-color:var(--line);cursor:not-allowed;text-decoration:line-through;}

.summary-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .lbl{color:var(--muted);}
.summary-row .val{font-weight:700;color:var(--navy);}
.summary-total{display:flex;justify-content:space-between;padding-top:14px;margin-top:6px;border-top:2px solid var(--navy);}
.summary-total .lbl{font-family:'Oswald';font-size:16px;color:var(--navy);}
.summary-total .val{font-family:'Oswald';font-size:22px;color:var(--red);}

.pix-box{
  background:var(--navy);color:var(--white);border-radius:var(--radius);padding:26px;text-align:center;
}
.pix-qr{
  width:170px;height:170px;margin:14px auto;background:repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0/16px 16px;
  border-radius:10px;border:6px solid var(--white);
}
.pix-code{
  background:rgba(255,255,255,.1);padding:12px;border-radius:8px;font-family:monospace;font-size:12px;
  word-break:break-all;margin:14px 0;color:#dbe2f5;
}
.success-box{text-align:center;padding:20px 0;}
.success-icon{
  width:74px;height:74px;border-radius:50%;background:#e7f6ee;color:var(--ok);
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px;
}

/* ---- account / admin ---- */
.dash-layout{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:36px 0;align-items:start;}
.side{background:var(--white);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;position:sticky;top:80px;}
.side-item{padding:13px 16px;font-size:14px;font-weight:600;color:var(--navy);border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:10px;}
.side-item:last-child{border-bottom:none;}
.side-item:hover{background:var(--paper);}
.side-item.active{background:var(--navy);color:var(--white);}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--line);padding:18px;}
.stat-card .num{font-family:'Oswald';font-size:28px;color:var(--navy);}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;}
.stat-card.accent .num{color:var(--red);}

table.data{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
table.data th{text-align:left;background:var(--navy);color:var(--white);font-size:12px;padding:11px 14px;letter-spacing:.03em;text-transform:uppercase;}
table.data td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
table.data tr:last-child td{border-bottom:none;}
.status-pill{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.status-pill.confirmado{background:#e7f6ee;color:var(--ok);}
.status-pill.cancelado{background:#fdecec;color:var(--red-2);}

.appt-list{display:flex;flex-direction:column;gap:12px;}
.appt-item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.appt-left .svc{font-family:'Oswald';font-size:16px;color:var(--navy);}
.appt-left .meta{font-size:13px;color:var(--muted);margin-top:3px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .ic{font-size:38px;margin-bottom:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(11,12,16,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);}
.modal h3{font-size:18px;color:var(--navy);margin-bottom:10px;}
.modal p{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.modal .row{display:flex;gap:10px;justify-content:flex-end;}

.toggle{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);cursor:pointer;flex-shrink:0;}
.toggle.on{background:var(--ok);}
.toggle .dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--white);transition:left .15s ease;}
.toggle.on .dot{left:20px;}

.banner-lock{
  background:#fff4e5;color:#8a5a00;border:1px solid #ffdca3;padding:12px 16px;border-radius:10px;
  font-size:13.5px;font-weight:600;margin-bottom:18px;
}

@media(max-width:860px){
  .hero-inner{grid-template-columns:1fr;}
  .grid.cols-3{grid-template-columns:1fr;}
  .grid.cols-2{grid-template-columns:1fr;}
  .steps-strip{grid-template-columns:repeat(3,1fr);row-gap:18px;}
  .dash-layout{grid-template-columns:1fr;}
  .side{position:static;display:flex;overflow-x:auto;}
  .side-item{border-bottom:none;border-right:1px solid var(--line);white-space:nowrap;}
  .stat-cards{grid-template-columns:repeat(2,1fr);}
  .time-grid{grid-template-columns:repeat(3,1fr);}
  nav.top .nav-label{display:none;}
  .hero h1{font-size:32px;}
}
@media(max-width:480px){
  .time-grid{grid-template-columns:repeat(2,1fr);}
  .stat-cards{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   MK BARBERSHOP — booking app
   Persistence: window.storage (shared = business data, personal = session)
============================================================ */

const LOGO_SVG = `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon points="18,20 30,20 30,58 40,42 40,58 50,20 62,20 44,80 32,80" fill="var(--white)"/>
  <polygon points="46,20 58,20 58,80 46,80" fill="var(--blue)"/>
  <polygon points="58,44 74,20 88,20 68,48" fill="var(--red)"/>
  <polygon points="58,52 74,80 88,80 68,54" fill="var(--red)"/>
</svg>`;

const state = {
  route: 'home',
  routeParams: {},
  session: null,        // {email,name,role}
  services: [],
  appointments: [],
  blocked: [],           // [{date:'YYYY-MM-DD', fullDay:bool, times:[]}]
  booking: {},            // in-progress booking selections
  loading: true,
  authError: '',
  adminTab: 'dashboard',
  accountTab: 'upcoming',
  toast: null,
};

const DAY_NAMES = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTH_NAMES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

function fmtDateISO(d){ return d.toISOString().slice(0,10); }
function fmtBRL(n){ return 'R$ ' + Number(n).toFixed(2).replace('.',','); }
function todayISO(){ return fmtDateISO(new Date()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------------- storage helpers ---------------- */
async function storeGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function storeSet(key, val, shared){
  try{ await window.storage.set(key, JSON.stringify(val), shared); }
  catch(e){ console.error('storage set failed', key, e); }
}

/* ---------------- seed & load ---------------- */
async function seedIfNeeded(){
  let services = await storeGet('services:list', true);
  if(!services){
    services = [
      {id:uid(), name:'Corte de Cabelo', description:'Corte tradicional com acabamento na navalha.', price:40, duration:30, active:true, promoOnly:false},
      {id:uid(), name:'Sobrancelha', description:'Sobrancelha feita com cuidado e maestria.', price:15, duration:5, active:true, promoOnly:false},
      {id:uid(), name:'Barba', description:'Barba modelada com toalha quente e navalha.', price:30, duration:20, active:true, promoOnly:false},
      {id:uid(), name:'Barba + Cabelo', description:'Combo completo: corte e barba na régua.', price:65, duration:50, active:true, promoOnly:false},
      {id:uid(), name:'Corte Promocional', description:'Corte especial com preço promocional — disponível somente às quartas-feiras.', price:35, duration:30, active:true, promoOnly:true},
    ];
    await storeSet('services:list', services, true);
  }
  let appointments = await storeGet('appointments:list', true);
  if(!appointments){ appointments = []; await storeSet('appointments:list', appointments, true); }
  let blocked = await storeGet('blocked:list', true);
  if(!blocked){ blocked = []; await storeSet('blocked:list', blocked, true); }
  let users = await storeGet('users:list', true);
  if(!users){
    users = [{id:uid(), name:'Barbeiro Admin', email:'admin@mkbarbershop.com', phone:'(11) 90000-0000', password:'admin123', role:'admin'}];
    await storeSet('users:list', users, true);
  }
  return {services, appointments, blocked, users};
}

async function loadAll(){
  const seeded = await seedIfNeeded();
  state.services = seeded.services;
  state.appointments = seeded.appointments;
  state.blocked = seeded.blocked;
  const sess = await storeGet('session', false);
  if(sess){
    const users = await storeGet('users:list', true) || [];
    const u = users.find(x=>x.email===sess.email);
    if(u) state.session = {email:u.email, name:u.name, role:u.role, phone:u.phone};
  }
  state.loading = false;
  render();
}

async function getUsers(){ return await storeGet('users:list', true) || []; }
async function saveUsers(list){ await storeSet('users:list', list, true); }
async function saveServices(){ await storeSet('services:list', state.services, true); }
async function saveAppointments(){ await storeSet('appointments:list', state.appointments, true); }
async function saveBlocked(){ await storeSet('blocked:list', state.blocked, true); }

/* ---------------- routing ---------------- */
function go(route, params){
  state.route = route;
  state.routeParams = params || {};
  window.scrollTo(0,0);
  render();
}

/* Used INSIDE page-render functions (e.g. Page_BookConfirm) instead of go().
   go() triggers a full nested render() + DOM write while the outer render()
   is still building its own HTML string, and the outer call then overwrites
   the inner one with blank content. redirect() just updates the route and
   recurses into renderRoute() to produce the right markup inline, with no
   extra DOM writes. */
function redirect(route, params){
  state.route = route;
  state.routeParams = params || {};
  return renderRoute();
}

/* ---------------- business rules ---------------- */
function generateSlots(){
  const slots = [];

  for(let h=9; h<=20; h++){
    slots.push(String(h).padStart(2,'0')+':00');

    if(h<20){
      slots.push(String(h).padStart(2,'0')+':30');
    }
  }

  return slots;
}

const ALL_SLOTS = generateSlots();

function isBookingLocked(){
  const now = new Date();
  const hour = now.getHours();

  // Bloqueia das 21:00 até 09:59 do dia seguinte.
  // Libera novamente às 10:00.
  return hour >= 21 || hour < 10;
}

function isDateFullyBlocked(iso){
  return state.blocked.some(b => b.date===iso && b.fullDay);
}

function blockedTimesFor(iso){
  const b = state.blocked.find(x=>x.date===iso);
  return b ? (b.times||[]) : [];
}

function takenTimesFor(iso){
  return state.appointments
    .filter(a => a.date===iso && a.status!=='Cancelado')
    .map(a => a.time);
}

function availableSlotsFor(iso, serviceDurationIgnored){
  if(isDateFullyBlocked(iso)) return [];

  const blockedT = blockedTimesFor(iso);
  const taken = takenTimesFor(iso);
  const now = new Date();
  const isToday = iso === todayISO();

  return ALL_SLOTS.map(t => {
    let disabled = blockedT.includes(t) || taken.includes(t);

    if(isToday){
      const [hh,mm] = t.split(':').map(Number);
      const slotDate = new Date();
      slotDate.setHours(hh,mm,0,0);

      if(slotDate.getTime() <= now.getTime()){
        disabled = true;
      }
    }

    return {
      time: t,
      disabled
    };
  });
}

  const todays = state.appointments.filter(a=>a.date===today && a.status!=='Cancelado').sort((a,b)=>a.time.localeCompare(b.time));
  const now = new Date();
  const next = todays.find(a => new Date(today+'T'+a.time) >= now);

  const countByService = {};
  state.appointments.filter(a=>a.status!=='Cancelado').forEach(a=>{ countByService[a.serviceName]=(countByService[a.serviceName]||0)+1; });
  const topService = Object.entries(countByService).sort((a,b)=>b[1]-a[1])[0];

  return `
  <h2 style="font-size:24px;color:var(--navy);margin-bottom:16px;">Painel administrativo</h2>
  <div class="stat-cards">
    <div class="stat-card"><div class="num">${todays.length}</div><div class="lbl">Agendamentos hoje</div></div>
    <div class="stat-card accent"><div class="num">${next?next.time:'—'}</div><div class="lbl">Próximo cliente${next?': '+next.clientName:''}</div></div>
    <div class="stat-card"><div class="num">${fmtBRL(revenueToday)}</div><div class="lbl">Faturamento estimado hoje</div></div>
    <div class="stat-card"><div class="num" style="font-size:16px;">${topService?topService[0]:'—'}</div><div class="lbl">Serviço mais escolhido</div></div>
  </div>
  <h3 style="font-size:16px;color:var(--navy);margin-bottom:10px;">Agendamentos de hoje</h3>
  ${todays.length===0 ? `<div class="empty-state card"><div class="ic">📭</div>Nenhum agendamento para hoje.</div>` : `
  <table class="data">
    <thead><tr><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Status</th></tr></thead>
    <tbody>
      ${todays.map(a=>`<tr><td>${a.time}</td><td>${a.clientName}</td><td>${a.serviceName}</td><td><span class="status-pill ${a.status.toLowerCase()}">${a.status}</span></td></tr>`).join('')}
    </tbody>
  </table>`}
  `;
}

function Admin_Appointments(){
  const all = [...state.appointments].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  return `
  <h2 style="font-size:24px;color:var(--navy);margin-bottom:16px;">Todos os agendamentos</h2>
  ${all.length===0 ? `<div class="empty-state card"><div class="ic">📭</div>Nenhum agendamento ainda.</div>` : `
  <table class="data">
    <thead><tr><th>Data</th><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th></tr></thead>
    <tbody>
      ${all.map(a=>{
        const d = new Date(a.date+'T12:00:00');
        return `<tr><td>${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}</td><td>${a.time}</td><td>${a.clientName}</td><td>${a.serviceName}</td><td>${fmtBRL(a.price)}</td><td><span class="status-pill ${a.status.toLowerCase()}">${a.status}</span></td></tr>`;
      }).join('')}
    </tbody>
  </table>`}
  `;
}

function Admin_Services(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2 style="font-size:24px;color:var(--navy);">Gerenciar serviços</h2>
    <button class="btn btn-primary sm" data-action="new-service">+ Novo serviço</button>
  </div>
  <div class="grid" style="grid-template-columns:1fr;">
    ${state.services.map(s=>`
      <div class="card">
        <div class="service-top">
          <div>
            <div class="service-name">${s.name} ${s.promoOnly?'<span class="badge red">Só quartas</span>':''}</div>
            <div class="service-desc" style="max-width:520px;">${s.description}</div>
            <div class="service-meta"><span>⏱ ${s.duration} min</span><span>${fmtBRL(s.price)}</span></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
            <div class="toggle ${s.active?'on':''}" data-action="toggle-service" data-id="${s.id}"><div class="dot"></div></div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-outline sm" data-action="edit-service" data-id="${s.id}">Editar</button>
              <button class="btn btn-outline sm" data-action="delete-service" data-id="${s.id}">Excluir</button>
            </div>
          </div>
        </div>
      </div>
    `).join('')}
  </div>
  `;
}

function Admin_Schedule(){
  const days = nextDays(21);
  const sel = state.adminScheduleDate || todayISO();
  const slots = ALL_SLOTS;
  const blockedT = blockedTimesFor(sel);
  const taken = takenTimesFor(sel);
  const fullyBlocked = isDateFullyBlocked(sel);
  return `
  <h2 style="font-size:24px;color:var(--navy);margin-bottom:16px;">Bloquear horários</h2>
  <div class="date-scroller">
    ${days.map(d=>{
      const iso = fmtDateISO(d);
      const selected = sel===iso;
      return `<div class="date-pill ${selected?'selected':''}" data-action="admin-pick-date" data-iso="${iso}">
        <div class="dow">${DAY_NAMES[d.getDay()]}</div><div class="dnum">${d.getDate()}</div><div class="mon">${MONTH_NAMES[d.getMonth()]}</div>
      </div>`;
    }).join('')}
  </div>
  <div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
    <div><b>Bloquear o dia inteiro</b><div style="color:var(--muted);font-size:13px;">Nenhum horário ficará disponível nesta data.</div></div>
    <div class="toggle ${fullyBlocked?'on':''}" data-action="toggle-fullday" data-iso="${sel}"><div class="dot"></div></div>
  </div>
  <div class="time-grid">
    ${slots.map(t=>{
      const isTaken = taken.includes(t);
      const isBlocked = blockedT.includes(t);
      const cls = isTaken ? 'taken' : (isBlocked ? 'selected' : '');
      return `<div class="time-slot ${cls}" ${isTaken?'':`data-action="toggle-slot-block" data-iso="${sel}" data-time="${t}"`}>${t}${isTaken?' 🔒':''}</div>`;
    }).join('')}
  </div>
  <p style="color:var(--muted);font-size:12.5px;margin-top:10px;">Vermelho = bloqueado pelo admin · Cinza riscado = já reservado por cliente. Clique num horário livre para bloquear/desbloquear.</p>
  `;
}

/* ================= actions / handlers ================= */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> go(el.getAttribute('data-nav')));
  });
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=> handleAction(el, e));
  });
  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.addEventListener('submit', handleLoginSubmit);
  const signupForm = document.getElementById('signup-form');
  if(signupForm) signupForm.addEventListener('submit', handleSignupSubmit);
}

async function handleAction(el, e){
  const action = el.getAttribute('data-action');
  switch(action){
    case 'start-booking':
      state.booking = {};
      go('book-service');
      break;
    case 'pick-service':
      state.booking.serviceId = el.getAttribute('data-id');
      state.booking.date = null; state.booking.time = null;
      go('book-date');
      break;
    case 'pick-date':
      state.booking.date = el.getAttribute('data-iso');
      state.booking.time = null;
      go('book-time');
      break;
    case 'pick-time':
      state.booking.time = el.getAttribute('data-time');
      go('book-confirm');
      break;
    case 'go-payment':
      go('book-payment');
      break;
    case 'copy-pix':
      try{ await navigator.clipboard.writeText(state.booking.pixCode||''); }catch(err){}
      el.textContent = 'Código copiado ✓';
      setTimeout(render, 1200);
      break;
    case 'confirm-payment': {
      if(el.disabled) break; // evita duplo clique
      const originalLabel = el.textContent;
      el.disabled = true;
      el.textContent = 'Confirmando...';
      try{
        const ok = await finalizeBooking();
        if(!ok){
          // finalizeBooking já tratou o erro/redirecionamento; apenas reabilita o botão se ele ainda existir na tela
          el.disabled = false;
          el.textContent = originalLabel;
        }
      }catch(error){
        console.error('Erro ao confirmar agendamento:', error);
        alert('Ocorreu um erro ao confirmar seu agendamento. Tente novamente.');
        el.disabled = false;
        el.textContent = originalLabel;
      }
      break;
    }
    case 'logout':
      state.session = null;
      await storeSet('session', null, false);
      go('home');
      break;
    case 'account-tab':
      state.accountTab = el.getAttribute('data-tab');
      render();
      break;
    case 'cancel-appt':
      await cancelAppointment(el.getAttribute('data-id'));
      break;
    case 'admin-tab':
      state.adminTab = el.getAttribute('data-tab');
      render();
      break;
    case 'toggle-service':
      await toggleService(el.getAttribute('data-id'));
      break;
    case 'new-service':
      openServiceModal(null);
      break;
    case 'edit-service':
      openServiceModal(el.getAttribute('data-id'));
      break;
    case 'delete-service':
      await deleteService(el.getAttribute('data-id'));
      break;
    case 'admin-pick-date':
      state.adminScheduleDate = el.getAttribute('data-iso');
      render();
      break;
    case 'toggle-fullday':
      await toggleFullDayBlock(el.getAttribute('data-iso'));
      break;
    case 'toggle-slot-block':
      await toggleSlotBlock(el.getAttribute('data-iso'), el.getAttribute('data-time'));
      break;
  }
}

async function handleLoginSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email').trim().toLowerCase();
  const password = fd.get('password');
  const users = await getUsers();
  const u = users.find(x=>x.email.toLowerCase()===email && x.password===password);
  if(!u){ state.authError = 'E-mail ou senha incorretos.'; render(); return; }
  state.session = {email:u.email, name:u.name, role:u.role, phone:u.phone};
  state.authError = '';
  await storeSet('session', {email:u.email}, false);
  go(u.role==='admin' ? 'admin' : (state.booking.time ? 'book-confirm' : 'home'));
}

async function handleSignupSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = fd.get('name').trim();
  const email = fd.get('email').trim().toLowerCase();
  const phone = fd.get('phone').trim();
  const password = fd.get('password');
  if(password.length<4){ state.authError='A senha deve ter pelo menos 4 caracteres.'; render(); return; }
  const users = await getUsers();
  if(users.some(u=>u.email.toLowerCase()===email)){ state.authError='Já existe uma conta com esse e-mail.'; render(); return; }
  const newUser = {id:uid(), name, email, phone, password, role:'client'};
  users.push(newUser);
  await saveUsers(users);
  state.session = {email, name, role:'client', phone};
  state.authError = '';
  await storeSet('session', {email}, false);
  go(state.booking.time ? 'book-confirm' : 'home');
}

async function finalizeBooking(){
  // Retorna true em caso de sucesso (já navegou para book-success),
  // ou false quando o erro já foi tratado (alerta exibido / usuário redirecionado).
  // Nunca deixa uma exceção escapar sem feedback visual.
  try{
    // 1. validar login
    if(!state.session || !state.session.email){
      throw new Error('Você precisa estar logado para concluir o agendamento. Faça login novamente.');
    }
    // 2. validar serviço selecionado
    if(!state.booking.serviceId){
      throw new Error('Nenhum serviço foi selecionado. Volte e escolha um serviço.');
    }
    // 3. validar data selecionada
    if(!state.booking.date){
      throw new Error('Nenhuma data foi selecionada. Volte e escolha uma data.');
    }
    // 4. validar horário selecionado
    if(!state.booking.time){
      throw new Error('Nenhum horário foi selecionado. Volte e escolha um horário.');
    }

    // 5. regra de corte: nada de novos agendamentos após 21:00
    if(isBookingLocked()){
      alert('Após às 21:00 não é possível concluir novos agendamentos. Tente novamente amanhã.');
      go('home');
      return false;
    }

    // 6. localizar o serviço pelo id (nunca assumir que existe)
    const svc = state.services.find(s => s.id === state.booking.serviceId);
    if(!svc){
      throw new Error('O serviço selecionado não foi encontrado. Por favor, escolha novamente.');
    }

    const iso = state.booking.date;
    const time = state.booking.time;

    // 7. reconferir se o horário continua disponível (pode ter sido reservado por outro cliente)
    const stillFree = availableSlotsFor(iso).find(s => s.time === time && !s.disabled);
    if(!stillFree){
      alert('Esse horário acabou de ser reservado por outro cliente. Escolha outro horário.');
      go('book-time');
      return false;
    }

    // 8. criar o objeto do agendamento
    const appt = {
      id: uid(),
      clientEmail: state.session.email,
      clientName: state.session.name,
      clientPhone: state.session.phone || '',
      serviceId: svc.id,
      serviceName: svc.name,
      date: iso,
      time: time,
      price: svc.price,
      status: 'Confirmado',
      createdAt: new Date().toISOString(),
    };

    // 9. adicionar ao estado em memória (atualiza "Meus agendamentos" e o painel admin imediatamente)
    state.appointments.push(appt);

    // 10. persistir no armazenamento — se falhar, desfazemos a alteração em memória e avisamos o usuário
    try{
      await saveAppointments();
    }catch(storageError){
      state.appointments.pop();
      throw new Error('Não foi possível salvar o agendamento. Verifique sua conexão e tente novamente.');
    }

    // notificação simulada para o barbeiro (estrutura pronta para integração futura com WhatsApp/e-mail)
    console.log('[Notificação Barbeiro]', `${appt.clientName} agendou ${appt.serviceName} em ${appt.date} às ${appt.time} — ${fmtBRL(appt.price)}`);

    // 11. guardar o último agendamento para a tela de sucesso e limpar o código PIX usado
    state.booking.lastAppointment = appt;
    state.booking.pixCode = null;

    // 12. redirecionar para a tela de sucesso
    go('book-success');
    return true;

  }catch(error){
    console.error('Erro em finalizeBooking:', error);
    alert(error && error.message ? error.message : 'Não foi possível concluir o agendamento. Tente novamente.');
    return false;
  }
}

async function cancelAppointment(id){
  const a = state.appointments.find(x=>x.id===id);
  if(!a) return;
  if(!confirm('Cancelar este agendamento?')) return;
  a.status = 'Cancelado';
  await saveAppointments();
  render();
}

async function toggleService(id){
  const s = state.services.find(x=>x.id===id);
  s.active = !s.active;
  await saveServices();
  render();
}

async function deleteService(id){
  if(!confirm('Excluir este serviço permanentemente?')) return;
  state.services = state.services.filter(s=>s.id!==id);
  await saveServices();
  render();
}

function openServiceModal(id){
  const existing = id ? state.services.find(s=>s.id===id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${existing?'Editar serviço':'Novo serviço'}</h3>
      <div class="field"><label>Nome</label><input id="m-name" value="${existing?existing.name:''}"></div>
      <div class="field"><label>Descrição</label><textarea id="m-desc" rows="3">${existing?existing.description:''}</textarea></div>
      <div class="field"><label>Preço (R$)</label><input id="m-price" type="number" step="0.01" value="${existing?existing.price:''}"></div>
      <div class="field"><label>Duração (min)</label><input id="m-dur" type="number" value="${existing?existing.duration:30}"></div>
      <div class="field" style="display:flex;align-items:center;gap:10px;">
        <input id="m-promo" type="checkbox" style="width:auto;" ${existing&&existing.promoOnly?'checked':''}>
        <label style="margin:0;">Disponível apenas às quartas-feiras</label>
      </div>
      <div class="row">
        <button class="btn btn-outline sm" id="m-cancel">Cancelar</button>
        <button class="btn btn-primary sm" id="m-save">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#m-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#m-save').onclick = async ()=>{
    const name = overlay.querySelector('#m-name').value.trim();
    const description = overlay.querySelector('#m-desc').value.trim();
    const price = parseFloat(overlay.querySelector('#m-price').value)||0;
    const duration = parseInt(overlay.querySelector('#m-dur').value)||30;
    const promoOnly = overlay.querySelector('#m-promo').checked;
    if(!name){ return; }
    if(existing){
      Object.assign(existing, {name,description,price,duration,promoOnly});
    }else{
      state.services.push({id:uid(), name, description, price, duration, promoOnly, active:true});
    }
    await saveServices();
    overlay.remove();
    render();
  };
}

async function toggleFullDayBlock(iso){
  let b = state.blocked.find(x=>x.date===iso);
  if(!b){ b = {date:iso, fullDay:true, times:[]}; state.blocked.push(b); }
  else{ b.fullDay = !b.fullDay; }
  await saveBlocked();
  render();
}

async function toggleSlotBlock(iso, time){
  let b = state.blocked.find(x=>x.date===iso);
  if(!b){ b = {date:iso, fullDay:false, times:[]}; state.blocked.push(b); }
  const idx = b.times.indexOf(time);
  if(idx>=0) b.times.splice(idx,1); else b.times.push(time);
  await saveBlocked();
  render();
}

/* ---------------- init ---------------- */
loadAll();
</script>
